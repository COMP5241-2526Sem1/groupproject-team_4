        <p>Course: Physics I | Quiz ID: 13</p>

            <table class="grading-table">
                <thead>

                <tbody>
                    
                    <tr data-student-id="34" data-submission-id="none">
                        <td class="student-name">daniel_miller</td>
                        <td class="student-response">No response</td>
                        <td>
                            
                            <span style="color: #999; font-style: italic;">No submission</span>
                            
                        </td>
                    </tr>
                    
                    <tr data-student-id="36" data-submission-id="58">
                        <td class="student-name">a</td>
                        <td class="student-response">Q4Q1AAA</td>
                        <td>
                            
                            <input type="number" 
                                   class="grade-input" 
                                   value="0.0" 
                                   min="0" 
                                   max="1"
                                   step="0.1"
                                   data-question-id="79"
                                   data-submission-id="58">
                            <span class="points-info">/ 1</span>

                                    onclick="gradeQuestion(this, 79, 58)">

                        </td>
                    </tr>
                    
                </tbody>

</div>

<script>
function gradeQuestion(button, questionId, submissionId) {
    const row = button.closest('tr');
    const input = row.querySelector('.grade-input');
    const resultMessage = row.querySelector('.result-message');
    const points = parseFloat(input.value);
    const maxPoints = parseFloat(input.max);
    
    // Validate input
    if (isNaN(points) || points < 0 || points > maxPoints) {
        showResult(resultMessage, `Please enter a valid grade between 0 and ${maxPoints}`, 'error');
        return;
    }
    
    // Disable button during request
    button.disabled = true;
    
    // Make API call
    fetch(`/teacher/question/${questionId}/grade`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            submission_id: submissionId,
            points: points
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showResult(resultMessage, `Saved: ${data.points}/${data.max_points} (${data.percentage}%)`, 'success');
            // Update input value to reflect saved value
            input.value = data.points;
        } else {
            showResult(resultMessage, data.error || 'Failed to save grade', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showResult(resultMessage, 'Network error occurred', 'error');
    })
    .finally(() => {
        button.disabled = false;
    });
}

function showResult(element, message, type) {
    element.textContent = message;
    element.className = `result-message result-${type}`;
    element.style.display = 'inline';
    
    // Hide message after 3 seconds
    setTimeout(() => {
        element.style.display = 'none';
    }, 3000);
}

// Add enter key support for grade inputs
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.grade-input').forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const button = this.parentElement.querySelector('.confirm-btn');
                if (button) {
                    button.click();
                }
            }
        });
    });
});
</script>
