<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Responsive login page styles */
        @media (max-width: 480px) {
            .auth-container {
                margin: 40px 16px;
                padding: 24px 20px;
            }
            
            .logo {
                width: 180px !important;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            .role-menu {
                gap: 16px;
            }
            
            .role-item {
                font-size: 1rem;
                padding: 4px 8px;
            }
        }
        
        @media (min-width: 481px) and (max-width: 768px) {
            .auth-container {
                margin: 50px 24px;
            }
        }
        
        /* Center form elements */
        form label {
            text-align: left;
        }
        
        /* Login message styles */
        #loginMsg {
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <img src="/static/polyulogo.png" alt="PolyU Logo" class="logo" style="width:220px; margin-bottom: 16px;">
        <h2>Sign In</h2>
        <div class="role-menu" id="roleMenu">
            <div class="role-item selected" data-role="student">Student</div>
            <div class="role-item" data-role="teacher">Teacher</div>
            <div class="role-item" data-role="admin">Admin</div>
        </div>
        <form id="loginForm">
            <input type="hidden" id="role" name="role" value="student">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Sign In</button>
        </form>
        <p id="loginMsg"></p>
        <a href="/register">No account? Register</a>
    </div>
    <script>
    // Role menu interaction
    document.querySelectorAll('.role-item').forEach(item => {
        item.onclick = function() {
            document.querySelectorAll('.role-item').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('role').value = this.getAttribute('data-role');
        };
    });
    document.getElementById('loginForm').onsubmit = async function(e) {
        e.preventDefault();
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        document.getElementById('loginMsg').textContent = result.msg;
        if (res.ok) {
            // Redirect to different role homepages after successful login
            if (result.role === 'student') {
                window.location.href = '/student_home';
            } 
            else if (result.role === 'teacher') {
                window.location.href = '/teacher_home';
            } 
            else if (result.role === 'admin') {
                window.location.href = '/admin_home';
            }
        }
    };
    </script>
</body>
</html>
