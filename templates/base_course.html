{% extends 'base.html' %}

{% block content %}
<div class="container">
    <aside class="sidebar">
        <div class="logo" onclick="window.location.href='/student_home'">
            <img src="/static/polyu_logo.png" alt="PolyU Logo">
            <div style="font-size:18px;font-weight:bold;margin-top:8px;">LEARN@POLYU</div>
        </div>

        <nav>
            {% block sidebar_links %}
            <!-- Default sidebar links can be overridden -->
            {% endblock %}
        </nav>


    </aside>

    <main class="main-content">
        {% block main_content %}
        <!-- Page-specific content will go here -->
        {% endblock %}
    </main>
</div>
{% endblock %}
