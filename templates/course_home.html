<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script>
        function loadAnnouncement() {
            document.querySelector('.main-content').innerHTML = '<h1>Announcement</h1><p>This is the announcement section.</p>';
        }
        function loadContent() {
            document.querySelector('.main-content').innerHTML = '<h1>Content</h1><p>This is the content section.</p>';
        }
        function loadQuiz() {
            document.querySelector('.main-content').innerHTML = '<h1>Quiz</h1><p>This is the quiz section.</p>';
        }
        function loadPoll() {
            document.querySelector('.main-content').innerHTML = '<h1>Poll</h1><p>This is the poll section.</p>';
        }
        function loadWordCloud() {
            document.querySelector('.main-content').innerHTML = '<h1>Word Cloud</h1><p>This is the word cloud section.</p>';
        }
        function loadMiniGames() {
            document.querySelector('.main-content').innerHTML = '<h1>Mini Games</h1><p>This is the mini games section.</p>';
        }
        function loadGrade() {
            document.querySelector('.main-content').innerHTML = '<h1>Grade</h1><p>This is the grade section.</p>';
        }
    </script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo" onclick="window.location.href='/student_home'">
            <img src="/static/polyu_logo.png" alt="PolyU Logo">
            <div style="font-size:18px;font-weight:bold;margin-top:8px;">LEARN@POLYU</div>
        </div>

        <nav>
            <a href="#" onclick="loadAnnouncement()">Announcement</a>
            <a href="#" onclick="">Content</a>
            <a href="javascript:void(0);" onclick="window.location.href=window.location.pathname + '/quiz';">Quiz</a>
            <a href="javascript:void(0);" onclick="window.location.href=window.location.pathname + '/poll';">Poll</a>
            <a href="javascript:void(0);" onclick="window.location.href=window.location.pathname + '/word_cloud';">Word Cloud</a>
            <a href="javascript:void(0);" onclick="window.location.href=window.location.pathname + '/mini_games';">Mini Games</a>
            <a href="#" onclick="">Grades</a>

            <a href="/logout">Sign Out</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1>{{ course.name }}</h1>
        <p>Description: {{ course.description }}</p>
        <p>Code: {{ course.code }}</p>
        <p>Teacher: {{ course.teacher.username }}</p>
        <p>Department: {{ course.department.name if course.department else 'N/A' }}</p>

    </main>

</div>

</body>
</html>
