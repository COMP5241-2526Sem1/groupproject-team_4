<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <img src="/static/polyu_logo.png" alt="PolyU Logo">
            <div style="font-size:18px;font-weight:bold;margin-top:8px;">LEARN@POLYU</div>
        </div>
        <nav>
            <a href="/institution" class="active">Institution Page</a>
            <div class="dropdown">
                <a href="/course/my">My Course</a>
                <div class="dropdown-content" id="course-dropdown">
                    <!-- Dynamically generate course options -->
                </div>
            </div>
            <a href="/profile">Profile</a>
            <a href="/activity">Activity</a>
            <a href="/course_registration">Courses</a>
            <a href="/calendar">Calendar</a>
            <a href="/messages">Messages</a>
            <a href="/grades">Grades</a>
            <a href="/assist">Assist</a>
            <a href="/logout">Sign Out</a>
        </nav>
        <div class="bottom">
            Privacy &nbsp;|&nbsp; Terms &nbsp;|&nbsp; Accessibility
        </div>
    </aside>
    <main class="main-content">
        <div id="institution-section" class="section"> </div>
        <div id="profile-section" class="section" style="display:none;"> </div>
        <div id="activity-section" class="section" style="display:none;"> </div>
        <div id="courses-section" class="section" style="display:none;">
            <div style="display:flex;gap:32px;margin-bottom:32px;">
                <button id="tab-add" class="course-tab-btn active" onclick="showCourseTab('add')">Add Courses</button>
        <button id="tab-table" class="course-tab-btn" onclick="showCourseTab('table')">View Schedule</button>
            </div>
            <div id="add-course-area">
                <h2 style="color:#8a1c32;">Available Courses</h2>
                <div id="available-courses">Loading...</div>
            </div>
            <div id="table-course-area" style="display:none;">
                <h2 style="color:#8a1c32;">My Courses</h2>
                <div id="my-courses">Loading...</div>
            </div>
            <div id="course-msg" style="margin-top:24px;color:#d81e06;font-size:1.1rem;"></div>
        </div>
        <div id="calendar-section" class="section" style="display:none;"> </div>
        <div id="messages-section" class="section" style="display:none;"> </div>
        <div id="grades-section" class="section" style="display:none;"> </div>
        <div id="assist-section" class="section" style="display:none;"> </div>
        <div id="tools-section" class="section" style="display:none;"> </div>
    </main>
</div>
<script>
    // Navigation is now handled through URL-based routing instead of JavaScript
</script>
<script>
        // Dynamically generate course dropdown menu
        function populateCourseDropdown() {
            fetch('/course/my')
                .then(response => response.json())
                .then(courses => {
                    const dropdown = document.getElementById('course-dropdown');
                    dropdown.innerHTML = '';
                    courses.forEach(course => {
                        const link = document.createElement('a');
                        link.href = `/course/${course.id}`; // or `/course/${course.code}`
                        link.textContent = course.name;
                        dropdown.appendChild(link);
                    });
                })
                .catch(error => console.error('Error loading courses:', error));
        }

        // Call after page loads
        document.addEventListener('DOMContentLoaded', populateCourseDropdown);
    </script>
</body>
</html>
