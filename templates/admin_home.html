<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* 强制覆盖外部 .container 样式，保证主内容区填满 */
        .container {
            max-width: none !important;
            width: 100% !important;
            margin: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
            display: flex !important;
            height: 100vh;
        }
        .main-content {
            margin-left: 240px;
            flex: 1;
            width: auto;
            height: 100vh;
            background: #fff;
            border-radius: 0;
            box-shadow: none;
            padding: 48px 40px;
            overflow-y: auto;
            display: block;
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('/static/background.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        .sidebar {
            width: 240px;
            min-width: 240px;
            height: 100vh;
            background: #8a1c32;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding-top: 32px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
        }
        .section {
            width: 100%;
            height: 100%;
            display: block;
        }
        .sidebar .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .sidebar .logo img {
            width: 80px;
        }
        .sidebar nav {
            flex: 1;
        }
        .sidebar nav a {
            display: flex;
            align-items: center;
            padding: 16px 24px;
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.2s;
            cursor: pointer;
        }
        .sidebar nav a.active {
            background: #a62c43;
        }
        .sidebar nav a:hover {
            background: #a62c43;
        }
        .sidebar .bottom {
            padding: 16px 24px;
            font-size: 12px;
            color: #e0e0e0;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .user-table th {
            background: #8a1c32;
            color: #fff;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 1.05rem;
        }
        .user-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            color: #333;
            font-size: 1rem;
        }
        .user-table tr:hover {
            background: #f9f9f9;
        }
        .btn-delete {
            padding: 6px 16px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-delete:hover {
            background: #c62828;
        }
        .btn-add {
            padding: 12px 24px;
            background: #8a1c32;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 16px;
        }
        .btn-add:hover {
            background: #a62c43;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #8a1c32;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            transition: all 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #8a1c32;
            outline: none;
        }
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <img src="/static/polyu_logo.png" alt="PolyU Logo">
            <div style="font-size:18px;font-weight:bold;margin-top:8px;">LEARN@POLYU</div>
        </div>
        <nav>
            <a href="#" class="active" onclick="showSection('manage')">Manage Info</a>
            <a href="/logout">Sign Out</a>
        </nav>
        <div class="bottom">
            Privacy &nbsp;|&nbsp; Terms &nbsp;|&nbsp; Accessibility
        </div>
    </aside>
    <main class="main-content">
        <div id="manage-section" class="section">
            <h1 style="color:#8a1c32;font-size:2.5rem;font-weight:bold;margin-top:0;margin-bottom:24px;">Manage User Information</h1>
            
            <!-- Message area -->
            <div id="admin-message"></div>
            
            <!-- Select management type -->
            <div class="form-container" style="background:#fff;border:2px solid #8a1c32;border-radius:12px;padding:32px;box-shadow:0 2px 8px rgba(138,28,50,0.1);margin-bottom:32px;">
                <h2 style="color:#8a1c32;margin-top:0;font-weight:bold;font-size:1.5rem;">Select Management Target</h2>
                <p style="color:#666;margin-bottom:24px;font-size:1rem;">Please select the user type you want to manage</p>
                <div class="form-group">
                    <label>User Type *</label>
                    <select id="user-type-select" onchange="loadUsers()" style="width:100%;">
                        <option value="">Please select user type</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>
            </div>
            
            <!-- User list area -->
            <div id="users-list-container" style="display:none;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h2 style="color:#8a1c32;margin:0;" id="users-title">User List</h2>
                    <button class="btn-add" onclick="showAddUserForm()">+ Add New User</button>
                </div>
                
                <!-- Add user form -->
                <div id="add-user-form" style="display:none;background:#f9f9f9;border:2px solid #8a1c32;border-radius:12px;padding:24px;margin-bottom:24px;">
                    <h3 style="color:#8a1c32;margin-top:0;">Add New User</h3>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="new-username" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="new-password" placeholder="Enter password (must contain letters and numbers)">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="new-email" placeholder="Enter email address">
                    </div>
                    <div style="display:flex;gap:12px;">
                        <button class="btn-add" onclick="addUser()">Confirm Add</button>
                        <button class="btn-delete" onclick="hideAddUserForm()">Cancel</button>
                    </div>
                </div>
                
                <!-- User table -->
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Registration Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr>
                            <td colspan="6" style="text-align:center;color:#888;padding:40px;">Please select user type</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    let currentUserType = '';

    function showSection(section) {
        document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
        const navs = document.querySelectorAll('.sidebar nav a');
        if(section === 'manage') {
            navs[0].classList.add('active');
        }
        document.querySelectorAll('.main-content .section').forEach(div => div.style.display = 'none');
        document.getElementById(section+'-section').style.display = 'block';
    }
    
    showSection('manage');

    function showMessage(msg, type = 'success') {
        const messageDiv = document.getElementById('admin-message');
        messageDiv.innerHTML = `<div class="message ${type}">${msg}</div>`;
        setTimeout(() => {
            messageDiv.innerHTML = '';
        }, 5000);
    }

    async function loadUsers() {
        const userType = document.getElementById('user-type-select').value;
        if (!userType) {
            document.getElementById('users-list-container').style.display = 'none';
            return;
        }
        
        currentUserType = userType;
        document.getElementById('users-list-container').style.display = 'block';
        document.getElementById('users-title').textContent = userType === 'teacher' ? 'Teacher List' : 'Student List';
        
        try {
            const res = await fetch(`/admin/users/${userType}`);
            const data = await res.json();
            
            if (!res.ok) {
                showMessage(data.msg || 'Failed to load', 'error');
                return;
            }
            
            displayUsers(data.users);
        } catch (error) {
            showMessage('Failed to load user list', 'error');
            console.error(error);
        }
    }

    function displayUsers(users) {
        const tbody = document.getElementById('users-table-body');
        
        if (!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;padding:40px;">No users</td></tr>';
            return;
        }
        
        const roleNames = {
            'teacher': 'Teacher',
            'student': 'Student'
        };
        
        tbody.innerHTML = users.map(user => `
            <tr>
                <td>${user.id}</td>
                <td>${user.username}</td>
                <td>${user.email || 'Not set'}</td>
                <td>${roleNames[user.role] || user.role}</td>
                <td>${user.created_at || 'Unknown'}</td>
                <td>
                    <button class="btn-delete" onclick="deleteUser(${user.id}, '${user.username}')">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    function showAddUserForm() {
        document.getElementById('add-user-form').style.display = 'block';
        document.getElementById('new-username').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('new-email').value = '';
    }

    function hideAddUserForm() {
        document.getElementById('add-user-form').style.display = 'none';
    }

    async function addUser() {
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value;
        const email = document.getElementById('new-email').value.trim();
        
        if (!username || !password || !email) {
            showMessage('Please fill in all required fields', 'error');
            return;
        }
        
        if (!currentUserType) {
            showMessage('Please select user type first', 'error');
            return;
        }
        
        try {
            const res = await fetch('/admin/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    password: password,
                    email: email,
                    role: currentUserType
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                showMessage(data.msg || 'Added successfully', 'success');
                hideAddUserForm();
                loadUsers();
            } else {
                showMessage(data.msg || 'Add failed', 'error');
            }
        } catch (error) {
            showMessage('Failed to add user', 'error');
            console.error(error);
        }
    }

    async function deleteUser(userId, username) {
        if (!confirm(`Are you sure you want to delete user "${username}"? This action cannot be undone!`)) {
            return;
        }
        
        try {
            const res = await fetch(`/admin/users/${userId}`, {
                method: 'DELETE'
            });
            
            const data = await res.json();
            
            if (res.ok) {
                showMessage(data.msg || 'Deleted successfully', 'success');
                loadUsers();
            } else {
                showMessage(data.msg || 'Delete failed', 'error');
            }
        } catch (error) {
            showMessage('Failed to delete user', 'error');
            console.error(error);
        }
    }
</script>
</body>
</html>
