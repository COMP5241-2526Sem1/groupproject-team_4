<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LEARN@POLYU</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        
        .auth-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px 40px;
            max-width: 440px;
            width: 100%;
            margin: 20px;
        }
        
        /* Responsive login page styles */
        @media (max-width: 480px) {
            .auth-container {
                margin: 20px 16px;
                padding: 32px 24px;
            }
            
            .logo {
                width: 160px !important;
            }
            
            h2 {
                font-size: 1.75rem;
            }
            
            .role-menu {
                gap: 12px;
            }
            
            .role-item {
                font-size: 0.9rem;
                padding: 8px 12px;
            }
        }
        
        @media (min-width: 481px) and (max-width: 768px) {
            .auth-container {
                margin: 50px 24px;
            }
        }
        
        /* Center form elements */
        form label {
            text-align: left;
        }
        
        .logo {
            width: 200px;
            margin-bottom: 24px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        
        h2 {
            color: #1a1a1a;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 32px;
        }
        
        .role-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            background: #f5f5f5;
            padding: 4px;
            border-radius: 12px;
        }
        
        .role-item {
            flex: 1;
            padding: 10px 16px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .role-item.selected {
            background: #8a1c32;
            color: white;
            box-shadow: 0 2px 8px rgba(138, 28, 50, 0.3);
        }
        
        .role-item:hover:not(.selected) {
            background: #e8e8e8;
            color: #333;
        }
        
        form {
            margin-top: 0;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #333;
            text-align: left;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #8a1c32;
            outline: none;
            box-shadow: 0 0 0 3px rgba(138, 28, 50, 0.1);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8a1c32 0%, #a62c43 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(138, 28, 50, 0.3);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        #loginMsg {
            min-height: 24px;
            margin: 16px 0;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }
        
        #loginMsg.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        
        #loginMsg.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }
        
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #666;
        }
        
        .register-link a {
            color: #8a1c32;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .register-link a:hover {
            color: #a62c43;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <img src="/static/polyulogo.png" alt="PolyU Logo" class="logo">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to continue to LEARN@POLYU</p>
        <div class="role-menu" id="roleMenu">
            <div class="role-item selected" data-role="student">Student</div>
            <div class="role-item" data-role="teacher">Teacher</div>
            <div class="role-item" data-role="admin">Admin</div>
        </div>
        <form id="loginForm">
            <input type="hidden" id="role" name="role" value="student">
            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit">Sign In</button>
        </form>
        <p id="loginMsg"></p>
        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>
    <script>
    // Role menu interaction
    document.querySelectorAll('.role-item').forEach(item => {
        item.onclick = function() {
            document.querySelectorAll('.role-item').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            document.getElementById('role').value = this.getAttribute('data-role');
        };
    });
    document.getElementById('loginForm').onsubmit = async function(e) {
        e.preventDefault();
        const submitBtn = this.querySelector('button[type="submit"]');
        const msgEl = document.getElementById('loginMsg');
        
        // Disable button and show loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        msgEl.textContent = '';
        msgEl.className = '';
        
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };
        
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (res.ok) {
                msgEl.textContent = result.msg || 'Login successful! Redirecting...';
                msgEl.className = 'success';
                
                // Redirect to different role homepages after successful login
                setTimeout(() => {
                    if (result.role === 'student') {
                        window.location.href = '/student_home';
                    } else if (result.role === 'teacher') {
                        window.location.href = '/teacher_home';
                    } else if (result.role === 'admin') {
                        window.location.href = '/admin_home';
                    }
                }, 500);
            } else {
                msgEl.textContent = result.msg || 'Login failed. Please try again.';
                msgEl.className = 'error';
            }
        } catch (error) {
            msgEl.textContent = 'Connection error. Please check your network.';
            msgEl.className = 'error';
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    };
    </script>
</body>
</html>
