{% extends 'poll_base.html' %}

{% block title %}{{ poll.name }}{% endblock %}

{% block main_content %}
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.poll-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 0 15px;
}

.poll-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
    color: white;
    margin-bottom: 20px;
}

/* Poll Header */
.poll-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
}

.poll-info {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
}

.back-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 18px;
}

.back-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
}

.poll-question-number {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.9;
    letter-spacing: 0.5px;
}

.favorite-btn {
    background: rgba(255, 255, 255, 0.2);
    border: none;
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-size: 18px;
}

.favorite-btn:hover {
    background: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
}

/* Question Section */
.question-section {
    padding: 30px 20px;
}

.question-title {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.8;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.question-box {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 28px;
    word-break: break-word;
}

.options-title {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.8;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Options Section */
.options-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.option-item {
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.option-item:hover {
    background: rgba(255, 255, 255, 0.25);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateX(4px);
}

.option-content {
    flex: 1;
}

.option-label {
    font-size: 15px;
    font-weight: 500;
    display: block;
    word-break: break-word;
}

.option-count {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 12px;
    padding-left: 12px;
    border-left: 1px solid rgba(255, 255, 255, 0.2);
    white-space: nowrap;
}

.option-count i {
    font-size: 16px;
    opacity: 0.8;
}

.count-number {
    font-weight: 700;
    font-size: 16px;
    min-width: 24px;
    text-align: right;
}

/* Action Section */
.action-section {
    padding: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
}

.participate-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.25);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.participate-btn:hover {
    background: rgba(255, 255, 255, 0.35);
    border-color: rgba(255, 255, 255, 0.6);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
}

.participate-btn.disabled {
    opacity: 0.6;
    cursor: not-allowed;
    background: rgba(0, 0, 0, 0.2);
}

.participate-btn.disabled:hover {
    transform: none;
    box-shadow: none;
}

.participate-btn i {
    font-size: 18px;
}

/* No Content */
.no-content {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    font-size: 16px;
}

/* Responsive */
@media (max-width: 480px) {
    .poll-container {
        margin: 10px auto;
        padding: 0 10px;
    }

    .poll-card {
        border-radius: 12px;
    }

    .poll-header {
        padding: 16px;
    }

    .question-section {
        padding: 20px 16px;
    }

    .question-box {
        font-size: 16px;
        margin-bottom: 20px;
    }

    .action-section {
        padding: 16px;
    }

    .participate-btn {
        padding: 12px 16px;
        font-size: 14px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Initialize charts for each question
    {% for question in poll.questions %}
        {% if question.type == 'mcq' and question.choices %}
        initializeChart({{ loop.index }}, [
            {% for choice in question.choices %}'{{ choice.content }}'{{ "," if not loop.last }}{% endfor %}
        ]);
        {% endif %}
    {% endfor %}
});

function initializeChart(questionIndex, choices) {
    const ctx = document.getElementById(`chart-q${questionIndex}`);
    if (!ctx) return;

    // Sample data - in production, fetch from backend
    const votes = new Array(choices.length).fill(0);
    const totalVotes = 0;

    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: choices,
            datasets: [{
                data: votes.length > 0 ? votes : [1],
                backgroundColor: [
                    '#FF6B6B',
                    '#4ECDC4',
                    '#45B7D1',
                    '#FFA07A',
                    '#98D8C8',
                    '#F7DC6F',
                    '#BB8FCE',
                    '#85C1E2'
                ],
                borderColor: '#fff',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        font: { size: 12 },
                        padding: 15
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const value = context.parsed || 0;
                            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                            return `${context.label}: ${value} (${percentage}%)`;
                        }
                    }
                }
            }
        }
    });
}
</script>
{% endblock %}
